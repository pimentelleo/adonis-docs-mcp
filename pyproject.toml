[project]
name = "adonis-docs-mcp"
version = "0.2.0"
description = "MCP server for AdonisJS documentation (v5, v6, v7) — gives AI agents quick access to AdonisJS docs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "pimen" }
]
keywords = ["mcp", "adonisjs", "documentation", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/pimentelleo/adonis-docs-mcp"
Repository = "https://github.com/pimentelleo/adonis-docs-mcp"
Issues = "https://github.com/pimentelleo/adonis-docs-mcp/issues"

[project.scripts]
adonis-docs-mcp = "adonis_docs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adonis_docs_mcp"]
